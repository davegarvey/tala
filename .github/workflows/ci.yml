name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy, rustfmt
        cache: true

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check compilation
      run: cargo check --all-targets

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Diagnose Windows daemon startup
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cargo build
        $env:TALA_HOME = Join-Path $env:RUNNER_TEMP "tala-smoke"
        $p = Start-Process target/debug/tala.exe -ArgumentList '--json register --name=smoke --tool=ci' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/tala-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/tala-err.txt"
        if (-not $p.WaitForExit(15000)) {
          Get-Content "$env:RUNNER_TEMP/tala-out.txt", "$env:RUNNER_TEMP/tala-err.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:TALA_HOME/daemon.log" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "name = 'tala.exe'" | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
          Stop-Process -Id $p.Id -Force
          throw 'Registration hung'
        }
        Get-Content "$env:RUNNER_TEMP/tala-out.txt", "$env:RUNNER_TEMP/tala-err.txt"
        if ($p.ExitCode -ne 0) { throw 'Registration failed' }
        target/debug/tala.exe stop
        Remove-Item Env:TALA_HOME

    - name: Run tests
      run: cargo test --verbose -- --test-threads=1 --nocapture

    - name: Build
      run: cargo build --release
